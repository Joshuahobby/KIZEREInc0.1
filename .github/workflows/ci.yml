name: CI Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kizere
          POSTGRES_PASSWORD: password
          POSTGRES_DB: kizere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run check

      - name: Run Unit Tests
        run: npm run test
        env:
          DATABASE_URL: postgres://kizere:password@localhost:5432/kizere_test
          SESSION_SECRET: CI_TEST_SECRET
          NODE_ENV: test

      - name: Push DB schema (local postgres for E2E)
        run: npx drizzle-kit push --force
        env:
          DATABASE_URL: postgres://kizere:password@localhost:5432/kizere_test
          SESSION_SECRET: CI_TEST_SECRET
          NODE_ENV: test

      - name: Seed DB (roles + admin user for E2E)
        run: npx tsx scripts/seed-roles.ts && npx tsx scripts/seed.ts
        env:
          DATABASE_URL: postgres://kizere:password@localhost:5432/kizere_test
          SESSION_SECRET: CI_TEST_SECRET
          NODE_ENV: test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgres://kizere:password@localhost:5432/kizere_test
          SESSION_SECRET: CI_TEST_SECRET
          NODE_ENV: test
          BASE_URL: http://localhost:5000
          # seed.ts creates admin with username=admin password=Password123!
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: Password123!

      - name: Build Project
        run: npm run build
        env:
          DATABASE_URL: postgres://kizere:password@localhost:5432/kizere_test
          SESSION_SECRET: CI_TEST_SECRET
